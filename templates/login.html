<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HB Innovations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(124,92,255,0.18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0,180,255,0.12), transparent 30%),
                #080b12;

            color: white;
            overflow: hidden;
        }

        /* Background glowing circles */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: floating 7s ease-in-out infinite;
            pointer-events: none;
        }

        body::before {
            background: #7c5cff;
            top: -100px;
            left: -80px;
        }

        body::after {
            background: #00bfff;
            bottom: -100px;
            right: -80px;
            animation-delay: 2s;
        }

        @keyframes floating {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 25px);
            }
        }

        /* Login box */

        .login-box {
            width: 100%;
            max-width: 430px;

            padding: 38px 35px;

            background: rgba(17, 21, 32, 0.82);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45),
                0 0 35px rgba(124,92,255,0.08);

            backdrop-filter: blur(18px);

            animation: loginAppear 0.7s ease;
        }

        @keyframes loginAppear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Heading */

        .login-title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #ffffff,
                #a99cff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            text-align: center;
            color: #858b99;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Inputs */

        .input-group-custom {
            margin-bottom: 20px;
        }

        .input-group-custom label {
            display: block;
            margin-bottom: 8px;
            color: #cbd0dc;
            font-size: 13px;
            font-weight: 600;
        }

        .custom-input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 12px;

            color: white;

            outline: none;

            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: #666d7c;
        }

        .custom-input:focus {
            border-color: #7c5cff;

            background: rgba(124,92,255,0.06);

            box-shadow:
                0 0 0 3px rgba(124,92,255,0.10),
                0 0 20px rgba(124,92,255,0.08);

            transform: translateY(-1px);
        }

        /* Login button */

        .login-btn {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7c5cff,
                #6244e8
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 10px 25px rgba(124,92,255,0.22);
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(124,92,255,0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Register text */

        .register-text {
            text-align: center;
            margin-top: 25px;

            color: #777e8d;
            font-size: 13px;
        }

        .register-text a {
            color: #a99cff;
            text-decoration: none;
            font-weight: 700;

            transition: 0.3s;
        }

        .register-text a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(124,92,255,0.6);
        }

        /* Home link */

        .home-link {
            display: block;
            text-align: center;

            margin-top: 15px;

            color: #666d7c;
            font-size: 12px;

            text-decoration: none;

            transition: 0.3s;
        }

        .home-link:hover {
            color: #a99cff;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .login-box {
                margin: 20px;
                padding: 30px 24px;
            }

            .login-title {
                font-size: 26px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <h2 class="login-title">
            Welcome Back
        </h2>

        <p class="login-subtitle">
            Login to continue to HB Innovations
        </p>


        <form method="POST">

            <div class="input-group-custom">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="custom-input"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group-custom">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="custom-input"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login →

            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>


        <a href="/" class="home-link">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
