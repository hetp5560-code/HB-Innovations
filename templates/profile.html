<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | HB Innovations</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Common CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/common.css') }}">

<!-- Profile CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/profile.css') }}">

</head>

<body>
<div class="stepper">

    <div class="step active">
        1
        <span>Profile</span>
    </div>

    <div class="line"></div>

    <div class="step">
        2
        <span>Education</span>
    </div>

    <div class="line"></div>

    <div class="step">
        3
        <span>Experience</span>
    </div>

    <div class="line"></div>

    <div class="step">
        4
        <span>Skills</span>
    </div>

    <div class="line"></div>

    <div class="step">
        5
        <span>Projects</span>
    </div>

    <div class="line"></div>

    <div class="step">
        6
        <span>Certificates</span>
    </div>

    <div class="line"></div>

    <div class="step">
        7
        <span>Resume</span>
    </div>

</div>
<div class="container py-5">

    <div class="profile-card">

        <h2 class="text-center mb-4">
            Complete Your Profile
        </h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="text-center mb-4">

                <div class="photo-box">

                    <i class="bi bi-person-circle"></i>

                </div>

                <input
    type="file"
    name="photo"
    class="form-control mt-3"
    accept="image/*">

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Phone Number</label>

                    <input type="text"
                           name="phone"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Date of Birth</label>

                    <input type="date"
                           name="dob"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Gender</label>

                    <select
                        name="gender"
                        class="form-select">

                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>City</label>

                    <input type="text"
                           name="city"
                           class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label>Address</label>

                    <textarea
                        name="address"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="col-md-4 mb-3">

                    <label>State</label>

                    <input type="text"
                           name="state"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Country</label>

                    <input type="text"
                           name="country"
                           class="form-control"
                           value="India">

                </div>

                <div class="col-md-4 mb-3">

                    <label>Pincode</label>

                    <input type="text"
                           name="pincode"
                           class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label>About Me</label>

                    <textarea
                        name="about"
                        rows="5"
                        class="form-control"
                        placeholder="Write something about yourself..."></textarea>

                </div>

            </div>

            <button type="submit" class="btn btn-primary w-100">
    Save & Continue
</button>

        </form>

    </div>

</div>

</body>

</html>
